service: dave-mind

frameworkVersion: "3"

provider:
  name: aws
  runtime: python3.11
  region: us-east-1
  memorySize: 512
  timeout: 30

custom:
  customDomain:
    domainName: davemind.drawvid.com
    certificateArn: arn:aws:acm:us-east-1:593615615124:certificate/4f50765a-0d38-41ba-9651-0bf09aa5f0d4
    endpointType: regional
    securityPolicy: tls_1_2
    autoDomain: false
    createRoute53Record: true
    hostedZoneId: Z6OEJ6TI3FSOM

  pythonRequirements:
    # Force Linux x86_64 wheels so binary deps like pydantic_core work on
    # Lambda. Without this, packaging on macOS produces mac wheels that
    # ImportError at cold start. Docker would be the canonical fix but
    # this avoids the dependency.
    pipCmdExtraArgs:
      - "--platform"
      - "manylinux2014_x86_64"
      - "--only-binary=:all:"

functions:
  query:
    handler: app.lambda_handler
    # Scoped to this function rather than `provider` so the publicly-invokable
    # videoproxy Function URL doesn't inherit the API keys.
    environment:
      # SSM SecureString — resolved (KMS-decrypted) at DEPLOY time and baked
      # into the Lambda environment. Rotate via `aws ssm put-parameter` +
      # redeploy.
      ANTHROPIC_API_KEY: ${ssm:/dave/anthropic-api-key}
      # Pinned here rather than left to app.py's defaults so a deploy is
      # reproducible: the model in the Lambda is whatever this file says.
      DAVE_MODEL_RESPOND: claude-opus-5
      DAVE_MODEL_BACKGROUND: claude-haiku-4-5
      # SSM SecureString — same pattern as ANTHROPIC_API_KEY. Create with:
      # aws ssm put-parameter --name /dave/pexels-api-key --value "YOUR_KEY" --type SecureString
      PEXELS_API_KEY: ${ssm:/dave/pexels-api-key}
      # Wired to the videoproxy Function URL so Internet Archive videos are served
      # with CORS headers (the TV's canvas can't read non-CORS media). Resolved at
      # deploy time; an empty value would simply disable IA → Wikimedia/Pexels.
      VIDEO_PROXY_BASE:
        Fn::GetAtt: [VideoproxyLambdaFunctionUrl, FunctionUrl]
    package:
      patterns:
        - "!videoproxy.js"
    events:
      - http:
          path: query
          method: post
          cors: true
      - http:
          path: health
          method: get
          cors: true

  # CORS streaming proxy for Internet Archive videos. A Lambda Function URL in
  # RESPONSE_STREAM mode — API Gateway can't stream and caps payloads at ~10 MB,
  # so video must bypass it. Node runtime (response streaming is Node-native);
  # zero npm deps. Locked to archive.org in the handler. See videoproxy.js.
  videoproxy:
    handler: videoproxy.handler
    runtime: nodejs22.x
    timeout: 300
    url:
      invokeMode: RESPONSE_STREAM
    package:
      patterns:
        - "!**"
        - videoproxy.js

plugins:
  - serverless-python-requirements
  - serverless-domain-manager

package:
  individually: true
  patterns:
    - "!node_modules/**"
    - "!.git/**"
    - "!.env"
    - "!.venv/**"
    - "!tests/**"
    - "!requirements-dev.txt"
    - "!package.json"
    - "!package-lock.json"
